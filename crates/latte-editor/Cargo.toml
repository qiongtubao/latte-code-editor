[package]
name = "latte-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = [] }
latte-graph-adapter = { path = "../latte-graph-adapter" }
path-clean = "1"
dunce = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
notify = "6"
# Semantic search embeddings for T20/T21.
# fastembed 5.x bundles ORT; we opt out of the default feature set to avoid
# pulling image-models and use the `online` feature so the model is fetched
# from HF Hub on first use. CPU-only inference (no CUDA/DirectML/etc).
#
# We use `ort-load-dynamic` (not `ort-download-binaries`) because ort 2.0
# does not ship prebuilt ONNX Runtime binaries for `x86_64-apple-darwin`
# (Intel Mac). `ort-load-dynamic` makes ort-sys skip the download + link
# steps and instead load the shared library at runtime via libloading.
# At runtime, fastembed expects the ONNX Runtime dylib to be discoverable
# either by:
#   - `pip install onnxruntime` (Python wheel ships the dylib), or
#   - Building ONNX Runtime from source and pointing `ORT_LIB_PATH` at it, or
#   - Vendoring the dylib next to the binary at distribution time.
# On Apple Silicon and Linux/Windows x86_64 the prebuilts are available,
# so this could be flipped to `ort-download-binaries` there.
fastembed = { version = "5", default-features = false, features = ["ort-load-dynamic", "online"] }

# T21: vector store for semantic-search embeddings + per-symbol span metadata.
#
# - `rusqlite` with `bundled` so we ship our own SQLite (we control the ABI
#   and don't depend on a system libsqlite3).
# - `parking_lot::Mutex` is non-poisoning and faster than `std::sync::Mutex`;
#   we use it for the `EmbeddingStore` connection lock.
#
# DEVIATION from the T21 plan: the plan listed `sqlite-vss` as a Cargo dep,
# but the `sqlite-vss` crate is an FFI binding to the vss0 C extension that
# (a) only ships prebuilt static libs for macOS x86_64 / aarch64 and Linux
# x86_64, and (b) has a `build.rs` that *requires* either the
# `download-libs` feature (network-fetched static `.a`s linked into the
# binary) or a `LIB_SQLITE_VSS` env var pointing at a prebuilt copy. Either
# path would force a 100+ MB static-link step and a platform pin in CI.
#
# We do NOT need the `sqlite-vss` Rust crate to compile this module: the
# plan code uses raw SQL (`CREATE VIRTUAL TABLE ... USING vss0(...)`) and
# embeds raw f32 byte vectors via `rusqlite::params!`. The `vss0` extension
# itself is loaded into the connection at RUNTIME by the T22 caller via
# `Connection::load_extension` (after `enable_load_extension(true)`), with
# the vss0 dylib/so discoverable on the loader path. See `search/store.rs`
# for the full contract.
#
# Net effect: T22 can pick its own vss0 delivery path (vendored dylib,
# `sqlite-vss = { version = "0.1.2", features = ["download-libs"] }`, or
# system-installed `libsqlite_vector0` / `vss0`) without us having
# pre-pinned a heavy build-time dep here.
rusqlite = { version = "0.31", features = ["bundled"] }
parking_lot = "0.12"
# T25: crash recovery — read/write last-open workspace path under the
# platform config dir (`$XDG_CONFIG_HOME` on Linux, `~/Library/Application Support`
# on macOS, `%APPDATA%` on Windows). `dirs` 5.x is the actively maintained
# successor to the `dirs` 4.x line and supports the same `config_dir()` API.
dirs = "5"
# T26+: native folder picker for the "Open Folder" flow. `build_builder` registers
# the plugin (`tauri_plugin_dialog::init()`) so downstream crates don't need to.
tauri-plugin-dialog = "2"
# Round 2 (save mechanism): atomic file writes via NamedTempFile::new_in(parent_dir)
# + persist(target). Moved from [dev-dependencies] to here so cmd_write_file can
# use it at runtime. Still available to dev-builds as a transitive dep, so the
# existing #[cfg(test)] callers compile unchanged.
tempfile = "3"

[dev-dependencies]
proptest = "1"

[lib]
