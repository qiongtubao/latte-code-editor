[package]
name = "latte-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = [] }
latte-graph-adapter = { path = "../latte-graph-adapter" }
path-clean = "1"
dunce = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lib]
