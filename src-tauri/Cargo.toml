[package]
name = "latte-code-editor"
version = "0.1.0"
description = "A cross-platform lightweight code editor with code graph integration"
authors = ["Latte Team"]
edition = "2021"

[lib]
name = "latte_code_editor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
glob = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "7"
walkdir = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
regex = "1"
latte-rs-graph = { path = "../../latte-rs-graph" }
# Multi-agent discussion system
latte-agent-core = { path = "../../latte-rs-agents/latte-agent-core" }
latte-agent-orchestrator = { path = "../../latte-rs-agents/latte-agent-orchestrator" }
latte-ai = { path = "../../latte-rs-model-router/latte-ai" }
# LSP 相关依赖
lsp-types = "0.97"
async-lsp = "0.2"
# ripgrep 引擎（用 crate 形式集成，不 fork 进程）
ignore = "0.4"
grep = "0.4"
grep-regex = "0.1"
grep-matcher = "0.1"
grep-searcher = "0.1"
aho-corasick = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-appender = "0.2"
base64 = "0.22"
tauri-plugin-clipboard-manager = "2.3.2"

[dev-dependencies]
tempfile = "3"
